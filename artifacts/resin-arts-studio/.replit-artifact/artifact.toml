kind = "web"
previewPath = "/"
title = "Resin Arts Studio"
version = "1.0.0"
id = "artifacts/resin-arts-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23408

[services.development]
run = "pnpm --filter @workspace/resin-arts-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/resin-arts-studio", "run", "build" ]
publicDir = "artifacts/resin-arts-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23408"
BASE_PATH = "/"
